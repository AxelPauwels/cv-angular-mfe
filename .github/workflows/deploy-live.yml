# The only way to the live Firebase channel. See README.release.md.
#
# - Called by release.yml after a merged release PR has been tagged.
# - Run by hand (Actions → Deploy live → Run workflow) with an existing release
#   tag to redeploy it, for example to roll back to 1.0.0.

name: Deploy live

on:
  workflow_call:
    inputs:
      ref:
        description: Commit to deploy (the tagged merge commit)
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to (re)deploy, for example 1.0.0
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy live
    runs-on: ubuntu-latest
    # One live deploy at a time; a queued one waits instead of cancelling
    concurrency:
      group: deploy-live
      cancel-in-progress: false
    permissions:
      checks: write
      contents: read
    steps:
      - name: Check the release tag
        if: inputs.tag != ''
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$TAG' is not a release tag (<major>.<minor>.<patch>, for example 1.0.0)."
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || format('refs/tags/{0}', inputs.tag) }}

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - run: npm ci
      - run: npm run build:production

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CV_ANGULAR_MFE }}
          channelId: live
          projectId: cv-angular-mfe
