# Release flow for pull requests from release/<major>.<minor>.<patch> into main.
# See "Releases" in README.md. `npm run nx:release` (or the pre-push prompt)
# creates and pushes the release branch.
#
# - PR opened or updated: check that it comes from release/x.y.z (Source branch) and
#   that package.json already has that new version (Version; `npm run nx:release`
#   commits it), then deploy a Firebase preview. Both checks are required on main.
# - PR merged: tag the merge commit on main with the version, create a GitHub release
#   and deploy that commit live (deploy-live.yml). This is the only automatic live
#   deploy: other pushes or merges into main are checked by CI but not deployed.

name: Release

on:
  pull_request:
    branches:
      - main
    types: [opened, reopened, synchronize, ready_for_review, closed]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.pull_request.number }}
  # A newer push to the release PR replaces the running check and preview jobs;
  # the tag job after a merge is never cancelled
  cancel-in-progress: ${{ github.event.action != 'closed' }}

jobs:
  # Required check on main: only release/x.y.z branches of this repository may
  # be merged into main. Runs (and fails) for every other pull request.
  source:
    name: Source branch
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Check that the pull request comes from a release branch
        env:
          BRANCH: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$HEAD_REPO" != "$REPO" ]; then
            echo "::error::Only branches of $REPO can be merged into main, not $HEAD_REPO."
            exit 1
          fi
          if [[ ! "$BRANCH" =~ ^release/[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Only release/<major>.<minor>.<patch> branches can be merged into main, not '$BRANCH'. Release develop with 'npm run nx:release'."
            exit 1
          fi

  # Required check on main: the release branch carries a new version.
  # `npm run nx:release` commits it (chore(release): x.y.z); this job only checks.
  version:
    name: Version
    if: >-
      github.event.action != 'closed' &&
      startsWith(github.head_ref, 'release/') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.branch.outputs.version }}
      sha: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Read the version from the branch name
        id: branch
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          if [[ ! "$BRANCH" =~ ^release/([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "::error::Branch '$BRANCH' must be named release/<major>.<minor>.<patch>, for example release/1.0.0"
            exit 1
          fi
          echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Check that the version is new
        env:
          VERSION: ${{ steps.branch.outputs.version }}
        run: |
          if git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
            echo "::error::Tag $VERSION already exists. Use a new release branch, for example release/<next version>."
            exit 1
          fi
          LATEST=$(git tag --list '[0-9]*.[0-9]*.[0-9]*' | sort -V | tail -n1)
          if [ -n "$LATEST" ] && [ "$(printf '%s\n%s\n' "$LATEST" "$VERSION" | sort -V | tail -n1)" != "$VERSION" ]; then
            echo "::error::Version $VERSION must be higher than the latest release $LATEST."
            exit 1
          fi

      - name: Check package.json
        env:
          VERSION: ${{ steps.branch.outputs.version }}
        run: |
          for FILE in package.json package-lock.json; do
            FOUND=$(node -p "require('./$FILE').version")
            if [ "$FOUND" != "$VERSION" ]; then
              echo "::error file=$FILE::$FILE has version $FOUND, not $VERSION. Create release branches with 'npm run nx:release', or commit 'npm version $VERSION --no-git-tag-version' on this branch."
              exit 1
            fi
          done
          echo "::notice::Releasing $VERSION"

  preview:
    name: Firebase preview
    needs: version
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
      pull-requests: write
    steps:
      # The version commit, so the preview is exactly what will be released
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.sha }}

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - run: npm ci
      - run: npm run build:production
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CV_ANGULAR_MFE }}
          projectId: cv-angular-mfe

  tag:
    name: Tag and GitHub release
    if: >-
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true &&
      startsWith(github.head_ref, 'release/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Read the version from the branch name
        id: branch
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          if [[ ! "$BRANCH" =~ ^release/([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "::error::Branch '$BRANCH' must be named release/<major>.<minor>.<patch>, for example release/1.0.0"
            exit 1
          fi
          echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Tag the merge commit
        env:
          VERSION: ${{ steps.branch.outputs.version }}
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          if [ "$PACKAGE_VERSION" != "$VERSION" ]; then
            echo "::warning::package.json on main is $PACKAGE_VERSION, not $VERSION."
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION" -m "Release $VERSION"
          git push origin "refs/tags/$VERSION"

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.branch.outputs.version }}
        run: gh release create "$VERSION" --verify-tag --title "$VERSION" --generate-notes --latest

  deploy:
    name: Deploy live
    needs: tag
    uses: ./.github/workflows/deploy-live.yml
    with:
      ref: ${{ github.event.pull_request.merge_commit_sha }}
    secrets: inherit
    permissions:
      checks: write
      contents: read
